name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: newsorder_test
          POSTGRES_USER: newsorder
          POSTGRES_PASSWORD: newsorder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsorder -d newsorder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEWSORDER_RUNTIME_MODE: fixture
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://newsorder:newsorder@127.0.0.1:5432/newsorder_test
      DATABASE_URL_TEST: postgresql://newsorder:newsorder@127.0.0.1:5432/newsorder_test
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Check migration metadata
        run: pnpm db:check
      - name: Apply migrations to isolated PostgreSQL
        run: pnpm db:migrate
      - name: Unit and PostgreSQL integration tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @newsorder/web exec playwright install --with-deps chromium
      - name: Playwright and axe
        run: pnpm test:e2e

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the proposed tree
        run: /tmp/gitleaks dir . --redact --config .gitleaks.toml
